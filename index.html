    .perm-grid{ grid-template-columns:1fr; }
    .policy-section{ padding:24px 20px; }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .hero-star path{ animation:none; stroke-dashoffset:0; }
    *{ transition:none !important; }
  }
</style>

      sec('contact','15','İletişim',[
        {type:'contact', text:'Bu Gizlilik Politikası veya verilerinizle ilgili herhangi bir sorunuz, kaygınız veya talebiniz varsa lütfen bizimle iletişime geçin — her mesajı okuyoruz.'}

  /* ================= RENDER ================= */
  var current = 'en';
  var els = {
    body: document.body,
    html: document.documentElement,
    brandTitle: document.getElementById('brandTitle'),
    brandTag: document.getElementById('brandTag'),
    heroEyebrow: document.getElementById('heroEyebrow'),
    heroTitle: document.getElementById('heroTitle'),
    heroSubtitle: document.getElementById('heroSubtitle'),
    badgeEffective: document.getElementById('badgeEffective'),
    badgeUpdated: document.getElementById('badgeUpdated'),
    tocLabel: document.getElementById('tocLabel'),
    tocList: document.getElementById('tocList'),
    main: document.getElementById('mainContent'),
    footerRights: document.getElementById('footerRights'),
    footerTagline: document.getElementById('footerTagline')
  };

  function esc(str){
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderBlock(b){
    if(b.type === 'p'){
      return '<p>' + esc(b.text) + '</p>';
    }
    if(b.type === 'list'){
      return '<ul class="p-list">' + b.items.map(function(i){ return '<li>'+esc(i)+'</li>'; }).join('') + '</ul>';
    }
    if(b.type === 'box'){
      return '<div class="highlight-box">' + icons.check + '<p>'+esc(b.text)+'</p></div>';
    }
    if(b.type === 'permissions'){
      return '<div class="perm-grid">' + b.items.map(function(it){
        return '<div class="perm-card">'+
          '<div class="perm-head"><span class="perm-icon">'+icons[it.icon]+'</span><strong>'+esc(it.name)+'</strong></div>'+
          '<p>'+esc(it.desc)+'</p>'+
          '<span class="perm-tag">'+esc(it.tag)+'</span>'+
        '</div>';
      }).join('') + '</div>';
    }
    if(b.type === 'services'){
      return b.items.map(function(s){
        return '<div class="service-card">'+
          '<strong>'+esc(s.name)+'</strong>'+
          '<p>'+esc(s.purpose)+'</p>'+
          '<div class="service-links">'+
            '<a href="'+s.website+'" target="_blank" rel="noopener noreferrer">'+ (current==='ar' ? 'الموقع الرسمي' : current==='fr' ? 'Site officiel' : current==='tr' ? 'Resmi site' : 'Official website') +' ↗</a>'+
            '<a href="'+s.policy+'" target="_blank" rel="noopener noreferrer">'+ (current==='ar' ? 'سياسة الخصوصية' : current==='fr' ? 'Politique de confidentialité' : current==='tr' ? 'Gizlilik politikası' : 'Privacy policy') +' ↗</a>'+
          '</div>'+
        '</div>';
      }).join('');
    }
    if(b.type === 'contact'){
      return '<div class="contact-card">'+
        '<h2 data-role="display">'+ (current==='ar' ? 'تواصل معنا' : current==='fr' ? 'Contactez-nous' : current==='tr' ? 'Bize Ulaşın' : 'Contact Us') +'</h2>'+
        '<p>'+esc(b.text)+'</p>'+
        '<a class="contact-btn" href="mailto:zadaltaqwa@gmail.com">✉ zadaltaqwa@gmail.com</a>'+
      '</div>';
    }
    return '';
  }

  function render(lang){
    var d = T[lang];
    current = lang;
    els.body.setAttribute('data-lang', lang);
    els.html.setAttribute('lang', d.htmlLang);
    els.html.setAttribute('dir', d.dir);

    els.brandTitle.textContent = d.brandTitle;
    els.brandTag.textContent = d.brandTag;
    els.heroEyebrow.textContent = d.heroEyebrow;
    els.heroTitle.textContent = d.heroTitle;
    els.heroSubtitle.textContent = d.heroSubtitle;
    els.badgeEffective.innerHTML = d.badgeEffective;
    els.badgeUpdated.innerHTML = d.badgeUpdated;
    els.tocLabel.textContent = d.tocLabel;
    els.footerRights.textContent = d.footerRights;
    els.footerTagline.textContent = d.footerTagline;

    els.tocList.innerHTML = d.sections.map(function(s){
      return '<li><a href="#'+s.id+'" data-target="'+s.id+'">'+esc(s.title)+'</a></li>';
    }).join('');

    els.main.innerHTML = d.sections.map(function(s){
      var body = s.blocks.map(renderBlock).join('');
      var isContact = s.blocks.length && s.blocks[0].type === 'contact';
      if(isContact){
        return '<section id="'+s.id+'" class="policy-section" aria-labelledby="'+s.id+'-h">'+
          '<span class="section-num">'+s.num+'</span>'+ body +'</section>';
      }
      return '<section id="'+s.id+'" class="policy-section" aria-labelledby="'+s.id+'-h">'+
        '<span class="section-num">'+s.num+'</span>'+
        '<h2 id="'+s.id+'-h" data-role="display">'+esc(s.title)+'</h2>'+
        body +
      '</section>';
    }).join('');

    document.title = (lang==='ar' ? 'سياسة الخصوصية | ' : 'Privacy Policy | ') + d.brandTitle;

    document.querySelectorAll('.lang-btn').forEach(function(btn){
      var active = btn.getAttribute('data-lang') === lang;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    });

    setupScrollSpy();
  }

  document.querySelectorAll('.lang-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      render(btn.getAttribute('data-lang'));
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });

  /* smooth anchor scroll (accounts for RTL/LTR, native anchor works fine) */
  els.tocList.addEventListener('click', function(e){
    var a = e.target.closest('a');
    if(!a) return;
    e.preventDefault();
    var target = document.getElementById(a.getAttribute('data-target'));
    if(target){ target.scrollIntoView({behavior:'smooth', block:'start'}); }
  });

  /* progress bar */
  var progressBar = document.getElementById('progressBar');
  function updateProgress(){
    var h = document.documentElement;
    var scrollTop = h.scrollTop || document.body.scrollTop;
    var scrollHeight = (h.scrollHeight || document.body.scrollHeight) - h.clientHeight;
    var pct = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
    progressBar.style.width = pct + '%';
  }

  /* back to top */
  var backToTop = document.getElementById('backToTop');
  function updateBackToTop(){
    if(window.scrollY > 420){ backToTop.classList.add('visible'); }
    else{ backToTop.classList.remove('visible'); }
  }
  backToTop.addEventListener('click', function(){
    window.scrollTo({top:0, behavior:'smooth'});
  });

  window.addEventListener('scroll', function(){
    updateProgress();
    updateBackToTop();
  }, {passive:true});

  /* scroll spy */
  var observer = null;
  function setupScrollSpy(){
    if(observer){ observer.disconnect(); }
    var sections = document.querySelectorAll('.policy-section');
    var links = document.querySelectorAll('.toc li a');
    observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        var link = document.querySelector('.toc li a[data-target="'+entry.target.id+'"]');
        if(!link) return;
        if(entry.isIntersecting){
          links.forEach(function(l){ l.classList.remove('active'); });
          link.classList.add('active');
        }
      });
    }, {rootMargin:'-15% 0px -70% 0px', threshold:0});
    sections.forEach(function(s){ observer.observe(s); });
  }

  // تم تغيير اللغة الافتراضية هنا لتصبح الإنجليزية
  render('en');
  updateProgress();
  updateBackToTop();
})();
</script>
